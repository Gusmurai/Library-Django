{% extends 'library/base.html' %}

{% block content %}
<div class="auth-form-container">
    <h2 style="margin-top: 0; color: #3e2723;">Введите новый пароль</h2>

    <form method="POST" class="auth-form">
        {% csrf_token %}

        {% for field in form %}
            <div>
                <label style="font-weight: 600; color: #5d4037; font-size: 0.9rem;">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div style="color: #c62828; font-size: 0.8rem; margin-top: 5px;">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="btn-booking btn-full">
            Установить пароль
        </button>
    </form>
</div>
{% endblock %}
